<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-preload [field]="ptupuagrRol" *ngIf="ptupuagrRol.visible" (selected)="onptupuagrrolChange()"></imes-preload>
            <imes-input-string [field]="ptupuatrUsuario" *ngIf="ptupuatrUsuario.visible"></imes-input-string>
            <imes-input-string [field]="ptupuatrPrimerNombre" *ngIf="ptupuatrPrimerNombre.visible"></imes-input-string>
            <imes-input-string [field]="ptupuatrSegundoNombre" *ngIf="ptupuatrSegundoNombre.visible"></imes-input-string>
            <imes-input-string [field]="ptupuatrPrimerApellido" *ngIf="ptupuatrPrimerApellido.visible"></imes-input-string>
            <imes-input-string [field]="ptupuatrSegundoApellido" *ngIf="ptupuatrSegundoApellido.visible"></imes-input-string>
            <imes-lensesearch [field]="ptupuagrSucursal" *ngIf="ptupuagrSucursal.visible"
                (selected)="processptupuagrsucursalSelected($event)" (cleared)="cleanptupuagrsucursal()"
                (keypressLenseSearch)="onKeypressLenseSearch('onptupuagrsucursalChange')"
                (searched)="doSearchAction('ptupuagrSucursal')"></imes-lensesearch>
            <imes-input-string [field]="ptupuatrUsuarioLDAP" *ngIf="ptupuatrUsuarioLDAP.visible"></imes-input-string>
            <imes-input-string [field]="ptupuatrEmail" *ngIf="ptupuatrEmail.visible"></imes-input-string>
            <imes-lensesearch [field]="ptupuagrRegional" *ngIf="ptupuagrRegional.visible"
                (selected)="processptupuagrregionalSelected($event)" (cleared)="cleanptupuagrregional()"
                (keypressLenseSearch)="onKeypressLenseSearch('onptupuagrregionalChange')"
                (searched)="doSearchAction('ptupuagrRegional')"></imes-lensesearch>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
