<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h3 class="title">{{getCompleteTitle()}}</h3>

        <div class="master" [ngClass]="cssClasses">
            <h3 class="title">{{master.title}}</h3>
            <div class="piuRegion" [ngClass]="master.cssClasses">
                <imes-actionsnavigations [queryIU]="master"></imes-actionsnavigations>
                <div class="filter col-12 ">
                    <ul class="nav nav-tabs" role="tablist">
                        <li class="nav-item">
                            <a (click)="master.setActiveFilterIndex(0)" class="nav-link"
                                [ngClass]="{'active': master.activeFilter && master.activeFilter.index == 0}" role="tab" tabindex
                                data-bs-toggle="tab">{{master.f0.title}}
                                <button *ngIf="master.activeFilter && master.activeFilter.index == 0 && master.hideFilters && master.activeFilterIsHidden" [ngClass]="master.getShowFilterCSSClass()" (click)="master.showCurrentFilter()"
                                    aria-label="Show" title="Show"></button>
                                <button *ngIf="master.activeFilter && master.activeFilter.index == 0 && master.hideFilters && !master.activeFilterIsHidden" [ngClass]="master.getHideFilterCSSClass()" (click)="master.hideCurrentFilter()"
                                    aria-label="Hide" title="Hide"></button>
                            </a>
                        </li>
                    </ul>
                    <div *ngIf="!master.hideFilters || !master.activeFilterIsHidden" class="tab-content filterContent">
                            <div class="tab-pane" [ngClass]=" {'active': master.activeFilter && master.activeFilter.index == 0}" role="tabpanel">
                                <div class="filterVariables">
                                    <imes-input-string [field]="master.f0.vUsuario" *ngIf="master.f0.vUsuario.visible"></imes-input-string>
                                    <imes-input-string [field]="master.f0.vPrimerNombre" *ngIf="master.f0.vPrimerNombre.visible"></imes-input-string>
                                    <imes-input-string [field]="master.f0.vSegundoNombre" *ngIf="master.f0.vSegundoNombre.visible"></imes-input-string>
                                    <imes-input-string [field]="master.f0.vPrimerApellido" *ngIf="master.f0.vPrimerApellido.visible"></imes-input-string>
                                    <imes-input-string [field]="master.f0.vSegundoApellido" *ngIf="master.f0.vSegundoApellido.visible"></imes-input-string>
                                </div>
                                <div class="filterButtons">
                                    <button class="btn btn-outline-secondary btn-sm pi pi-search" (click)="master.f0.search()"
                                        aria-label="Search"></button>
                                    <button class="btn btn-outline-secondary btn-sm pi pi-trash" (click)="master.f0.clean()"
                                        aria-label="Clean"></button>
                                </div>
                            </div>
                    </div>
                </div>
                <imes-grid [piu]="master"></imes-grid>
            </div>
        </div>
        <fieldset class="col-12 details"  [ngClass]="cssClasses" [disabled]="!enableDetails" *ngIf="d0Visible">
            <legend *ngIf="false">Details legend</legend>
            <ul class="nav nav-tabs" role="tablist">
                <li class="nav-item" *ngIf="d0Visible">
                    <a (click)="setActiveDetail(0)" class="nav-link"
                            [ngClass]="{'active': activeDetail == 0}" role="tab" tabindex
                            data-bs-toggle="tab">{{d0.title}}</a>
                </li>
            </ul>
            <div class="tab-content detailsContent">
                <div class="tab-pane" [ngClass]=" {'active': activeDetail == 0}" *ngIf="d0Visible" role="tabpanel">
                        <h3 class="title">{{d0.title}}</h3>
                        <div class="piuRegion" [ngClass]="d0.cssClasses">
                            <imes-actionsnavigations [queryIU]="d0"></imes-actionsnavigations>
                            <imes-grid [piu]="d0"></imes-grid>
                        </div>
                </div>
            </div>
        </fieldset>
        <div class="col-12 mdiuButtons">
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_CLOSE', '')}}</button>
        </div>
    </ng-container>
</form>
