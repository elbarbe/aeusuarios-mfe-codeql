<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-input-string [field]="puatrLogin" *ngIf="puatrLogin.visible"></imes-input-string>
            <imes-input-string [field]="puatrDescripcion" *ngIf="puatrDescripcion.visible"></imes-input-string>
            <div class="form-group" *ngIf="pupassword.visible" [ngClass]="pupassword.editorCSSClasses">
                <label class="control-label">{{pupassword.alias}}</label>
                <input type="password" class="form-control" [(ngModel)]="pupassword.value"
                    [disabled]="!pupassword.enabled" [required]="pupassword.mandatory"
                    name="pupassword" 
                    autocomplete="off"/>
                <div *ngIf="pupassword.validationMessage != ''" class="validationMessage">
                    {{pupassword.validationMessage}}
                </div>
            </div>
            <div class="form-group" *ngIf="pupassword.visible" [ngClass]="pupassword.editorCSSClasses">
                <label class="control-label">{{pupassword.aliasConfirmationValue}}</label>
                <input type="password" class="form-control" [(ngModel)]="pupassword.confirmationValue"
                    [disabled]="!pupassword.enabled" [required]="pupassword.mandatory"
                    name="pupasswordConf" 
                    autocomplete="off"/>
            </div>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
