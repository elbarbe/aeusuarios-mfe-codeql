<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lense [field]="puthisUsuarioSistemaExterno" *ngIf="puthisUsuarioSistemaExterno.visible" (selected)="onputhisusuariosistemaexternoChange()"
                (cleared)="cleanputhisusuariosistemaexterno()" (searched)="doSearchAction('puthisUsuarioSistemaExterno')"></imes-lense>
            <div class="form-group" *ngIf="puNewPassword.visible" [ngClass]="puNewPassword.editorCSSClasses">
                <label class="control-label">{{puNewPassword.alias}}</label>
                <input type="password" class="form-control" [(ngModel)]="puNewPassword.value"
                    [disabled]="!puNewPassword.enabled" [required]="puNewPassword.mandatory"
                    name="puNewPassword" 
                    autocomplete="off"/>
                <div *ngIf="puNewPassword.validationMessage != ''" class="validationMessage">
                    {{puNewPassword.validationMessage}}
                </div>
            </div>
            <div class="form-group" *ngIf="puNewPassword.visible" [ngClass]="puNewPassword.editorCSSClasses">
                <label class="control-label">{{puNewPassword.aliasConfirmationValue}}</label>
                <input type="password" class="form-control" [(ngModel)]="puNewPassword.confirmationValue"
                    [disabled]="!puNewPassword.enabled" [required]="puNewPassword.mandatory"
                    name="puNewPasswordConf" 
                    autocomplete="off"/>
            </div>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
