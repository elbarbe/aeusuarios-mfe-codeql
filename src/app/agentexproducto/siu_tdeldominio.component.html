<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lense [field]="puthisAgentexProducto" *ngIf="puthisAgentexProducto.visible" (selected)="onputhisagentexproductoChange()"
                (cleared)="cleanputhisagentexproducto()" (searched)="doSearchAction('puthisAgentexProducto')"></imes-lense>
            <imes-lensesearch [field]="ptupuevcDominio" *ngIf="ptupuevcDominio.visible"
                (selected)="processptupuevcdominioSelected($event)" (cleared)="cleanptupuevcdominio()"
                (keypressLenseSearch)="onKeypressLenseSearch('onptupuevcdominioChange')"
                (searched)="doSearchAction('ptupuevcDominio')"></imes-lensesearch>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
