<waitDialog [showWait]="showWait"></waitDialog> 
<form novalidate>
    <ng-container *ngIf="visible">
        <h2 class="title">{{title}}</h2>
        <div class="siuRegion" [ngClass]="cssClasses">
            <imes-lensesearch [field]="puthisPlanes" *ngIf="puthisPlanes.visible"
                (selected)="processputhisplanesSelected($event)" (cleared)="cleanputhisplanes()"
                (keypressLenseSearch)="onKeypressLenseSearch('onputhisplanesChange')"
                (searched)="doSearchAction('puthisPlanes')"></imes-lensesearch>
            <imes-lensesearch [field]="puevcAfiliaciones" *ngIf="puevcAfiliaciones.visible"
                (selected)="processpuevcafiliacionesSelected($event)" (cleared)="cleanpuevcafiliaciones()"
                (keypressLenseSearch)="onKeypressLenseSearch('onpuevcafiliacionesChange')"
                (searched)="doSearchAction('puevcAfiliaciones')"></imes-lensesearch>
        </div>
        <div class="col-12 siuButtons">
            <button type="button" class="btnOk btn btn-primary" (click)="saveChanges()">{{langMng.translateText('app_SIU_BTNOK', '')}}</button>
            <button type="button" class="btnCancel btn btn-danger" (click)="processCancel()">{{langMng.translateText('app_SIU_BTNCANCEL', '')}}</button>
        </div>
    </ng-container>
</form>
